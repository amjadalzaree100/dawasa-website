<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="حمّل تطبيق دواسة — Android و iOS." />
    <title>تحميل التطبيق | دواسة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header" id="site-header"></header>
    <main>
      <section class="page-hero">
        <div class="container">
          <h1>تحميل التطبيق</h1>
          <p>حمّل تطبيق دواسة على هاتفك وابدأ رحلتك.</p>
        </div>
      </section>

      <section class="section">
        <div
          class="container"
          style="text-align: center; max-width: 640px; margin-inline: auto"
        >
          <!-- رمز QR الحقيقي -->
          <div class="qr-image-wrap">
            <img
              src="assets/images/qrcode.png"
              alt="رمز QR لتحميل تطبيق دواسة"
              width="220"
              height="220"
              loading="eager"
              decoding="async"
            />
          </div>

          <p class="qr-caption">
            امسح الرمز بكاميرا هاتفك — أو استخدم الأزرار أدناه للتحميل المباشر
          </p>

          <div class="store-btns">
            <a
              href="dawwasa-user-app.html"
              download="dawwasa-user-app.html"
              class="store-btn js-download"
              title="تحميل التطبيق — Android"
            >
              <svg viewBox="0 0 24 24">
                <path
                  d="M3.609 1.814L13.792 12 3.61 22.186a1.506 1.506 0 0 1-.248-1.093V2.907c0-.398.088-.777.247-1.093zM14.5 12.707l2.302 2.302-10.937 6.333 8.635-8.635zm3.206-3.207l2.853 1.648a1.5 1.5 0 0 1 0 2.598l-2.853 1.648L15.5 12l2.206-2.5zM5.864 2.658L16.802 8.99 14.5 11.293 5.864 2.658z"
                />
              </svg>
              <span><small>حمّل من</small><b>Google Play</b></span>
            </a>
            <a
              href="dawwasa-user-app.html"
              download="dawwasa-user-app.html"
              class="store-btn js-download"
              title="تحميل التطبيق — iOS"
            >
              <svg viewBox="0 0 24 24">
                <path
                  d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"
                />
              </svg>
              <span><small>حمّل من</small><b>App Store</b></span>
            </a>
          </div>

          <div class="notice green" style="margin-top: 32px; text-align: start">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 16v-4M12 8h.01" />
            </svg>
            <span>سيبدأ التحميل مباشرةً عند الضغط على أي من الزرّين — دون فتح الملف في المتصفح.</span>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <script src="js/main.js"></script>

    <script>
      /* ============================================================
         إجبار التحميل — لا يفتح الملف أبدًا في المتصفح
         ============================================================ */
      (function () {
        const FILE_NAME = "dawwasa-user-app.html";

        document.querySelectorAll(".js-download").forEach(function (link) {
          link.addEventListener("click", async function (e) {
            e.preventDefault();

            const url = link.getAttribute("href");
            const originalHTML = link.innerHTML;

            link.style.pointerEvents = "none";
            link.style.opacity = "0.7";

            try {
              const response = await fetch(url, { cache: "no-store" });
              if (!response.ok) {
                throw new Error("HTTP " + response.status);
              }

              const blob = await response.blob();
              const forcedBlob = new Blob([blob], {
                type: "application/octet-stream"
              });

              const blobUrl = URL.createObjectURL(forcedBlob);
              const a = document.createElement("a");
              a.href = blobUrl;
              a.download = FILE_NAME;
              a.rel = "noopener";
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);

              setTimeout(function () {
                URL.revokeObjectURL(blobUrl);
              }, 2000);

              link.querySelector("small").textContent = "✓ تم التحميل";
            } catch (err) {
              link.querySelector("small").textContent = "✗ فشل التحميل";
              alert(
                "تعذّر بدء التحميل.\n\n" +
                "تأكد أنك تفتح الصفحة عبر سيرفر (localhost أو Vercel)، لا من ملف محلي."
              );
              console.error(err);
            } finally {
              setTimeout(function () {
                link.style.pointerEvents = "";
                link.style.opacity = "";
                link.innerHTML = originalHTML;
              }, 2500);
            }
          });
        });
      })();
    </script>
  </body>
</html>
